spring.application.name=FDNCarGallery

#database
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=fdncargallery

spring.jackson.generator.write-bigdecimal-as-plain=true

#admin
fdn.admin.password=
fdn.branch.admin.password=

#log
logging.file.name=logs/fdn-car-gallery.log
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.max-file-size=10MB
# her log satırına işlemi yapan kullanıcı (MDC) eklenir; giriş yapılmamış isteklerde "anonim"
logging.pattern.level=%5p [%X{user:-anonim}]

#jwt
fdn.jwt.secret=

#mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
fdn.mail.from=